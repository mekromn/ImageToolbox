name: Reference Lab CI

on:
  push:
    branches:
      - feature/reference-lab
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Test core and build FOSS debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          java-package: 'jdk'
          cache: gradle

      - name: Run Reference Lab core unit tests
        run: bash ./gradlew :core:domain:testFossDebugUnitTest --stacktrace

      - name: Build FOSS debug APK
        run: bash ./gradlew :app:assembleFossDebug --stacktrace

      - name: Upload FOSS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Reference-Lab-FOSS-Debug-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
